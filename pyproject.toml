[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-ripple-engine"
version = "1.0.0"
description = "Explainable AI Market Ripple Engine for Real-Time Shock Propagation"
authors = [{ name = "Quant AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "neo4j>=5.19.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "feedparser>=6.0.11",
    "yfinance>=0.2.37",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "networkx>=3.2.1",
    "spacy>=3.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "respx>=0.21.1",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["backend", "ml"]
omit = ["tests/*"]
